# HTML 托管舱 · Cloudflare Worker 配置
# 部署: npx wrangler deploy
# 本地调试: npx wrangler dev

name = "htmltuoguan"
main = "src/index.js"
compatibility_date = "2025-06-01"

# ── 环境变量配置 ─────────────────────────────────────────────
# GH_OWNER / GH_REPO 已按你的仓库写死，直接 npx wrangler deploy 即可。
# 若换仓库，改成你自己的值即可。

[vars]
GH_OWNER = "dexin-11"
GH_REPO = "htmltuoguan"

# 可选：GH_BRANCH（默认 main，代码里已兜底，无需配置）
# GH_API（自建 GitHub Enterprise 的 API 地址，默认 https://api.github.com）

# 密钥（敏感信息，绝对不要写入仓库）：
#   npx wrangler secret put GH_TOKEN        # GitHub Token，需 repo（或 contents）读写权限
#   npx wrangler secret put ADMIN_PASSWORD  # 管理后台 /admin 的登录密码

# ── 站点后端（可选 · 声明式 KV 存储）────────────────────────
# 开启后每个站点自动拥有 POST/GET /{项目名}/api/submit 数据接口，
# 并支持页面内嵌 bay-config 自定义路由；/ai 为 AI 生成页面的规则指南页。
# 开启步骤：
#   1) npx wrangler kv namespace create BAYKV
#   2) 把输出的 id 填到下面，并取消两行注释
# 不开启时：静态托管完全不受影响，后端接口返回 503 提示未配置。
#
[[kv_namespaces]]
binding = "BAYKV"
id = "23a7ead793154c0c830e0fc0cb716ae2"   # ← 替换为第 1 步输出的 id
